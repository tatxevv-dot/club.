<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Club — футбол, матчи и live</title>
<meta name="description" content="Футбольные матчи, live-результаты, статистика игроков и трансляции.">
<style>
:root{--bg:#f5f5f7;--surface:#ffffff;--text:#1d1d1f;--muted:#6e6e73;--line:#e5e5ea;--blue:#0071e3;--live:#ff3b30;--green:#30d158;--radius:20px;--shadow:0 12px 30px rgba(0,0,0,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.45 -apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button{font:inherit}.wrap{max-width:1180px;margin:0 auto;padding:0 22px}header{position:sticky;top:0;z-index:50;background:rgba(245,245,247,.82);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.06)}header .wrap{display:flex;align-items:center;gap:28px;height:64px}header .logo{font-weight:800;font-size:22px;letter-spacing:-.03em}header nav{display:flex;gap:8px;margin-left:auto}header nav a{padding:9px 14px;border-radius:999px;color:var(--muted);font-weight:600;font-size:14px;transition:.2s}header nav a:hover{color:var(--text)}header nav a.on{background:#000;color:#fff}.hero{padding:72px 0 46px}.eyebrow{color:var(--blue);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:clamp(38px,7vw,72px);line-height:1.03;letter-spacing:-.045em;margin:14px 0 18px;font-weight:800}.hero p{max-width:640px;color:var(--muted);font-size:19px;margin:0}.section{padding:26px 0 54px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.section-head h2{font-size:clamp(26px,4vw,38px);letter-spacing:-.03em;margin:0;font-weight:800}.section-head a{color:var(--blue);font-weight:600}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);transition:transform .25s ease,box-shadow .25s ease}.card:hover{transform:translateY(-3px);box-shadow:0 18px 44px rgba(0,0,0,.10)}.match-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em}.live-badge{display:inline-flex;align-items:center;gap:6px;color:var(--live);font-weight:800}.dot{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.3s infinite}@keyframes pulse{50%{opacity:.25}}.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin:22px 0 14px;font-weight:700}.scoreboard .team{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.scoreboard .team.right{text-align:right}.score{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.meta{color:var(--muted);font-size:13px}.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;background:#f2f2f7;color:var(--muted);font-size:12px;font-weight:700}.pill.live{background:rgba(255,59,48,.10);color:var(--live)}.pill.win{background:rgba(48,209,88,.12);color:#1d8f4b}.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border:0;border-radius:999px;background:var(--blue);color:#fff;font-weight:700;font-size:15px;cursor:pointer;transition:.2s}.btn:hover{filter:brightness(1.06)}.btn.ghost{background:#e8e8ed;color:var(--text)}.input{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:16px;outline:none}.input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,113,227,.12)}h1{font-size:clamp(30px,5vw,46px);letter-spacing:-.035em;margin:34px 0 22px;font-weight:800}h3{font-size:18px;letter-spacing:-.02em;margin:0 0 14px;font-weight:700}.muted{color:var(--muted)}.empty{padding:44px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}.error{padding:18px;background:#fff2f2;border:1px solid #ffd4d1;color:#a3231c;border-radius:16px;font-weight:600}.skeleton{height:150px;border-radius:var(--radius);background:linear-gradient(90deg,#ececf1 25%,#f6f6f8 50%,#ececf1 75%);background-size:200% 100%;animation:sh 1.4s infinite}@keyframes sh{to{background-position:-200% 0}}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin:18px 0}.tab{padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}.tab.on{background:#000;color:#fff;border-color:#000}.timeline{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.timeline b{min-width:46px;color:var(--muted);font-variant-numeric:tabular-nums}.video{aspect-ratio:16/9;background:#000;border-radius:18px;overflow:hidden}.video video{width:100%;height:100%;object-fit:contain}.back{display:inline-flex;align-items:center;gap:8px;color:var(--blue);font-weight:700;margin:24px 0 16px}.match-hero{background:#000;color:#fff;border-radius:28px;padding:38px 28px;margin:24px 0 22px;position:relative;overflow:hidden}.match-hero:before{content:'';position:absolute;inset:-40%;background:radial-gradient(circle at 20% 20%,rgba(0,113,227,.35),transparent 45%),radial-gradient(circle at 80% 80%,rgba(255,59,48,.25),transparent 45%)}.match-hero>*{position:relative}.match-hero .scoreboard{color:#fff}.match-hero .score{font-size:52px}.match-hero .meta{color:rgba(255,255,255,.65)}.player-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.player-card{display:flex;align-items:center;gap:14px}.avatar{width:54px;height:54px;border-radius:50%;background:#e8e8ed;object-fit:cover;flex:none}.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.stat{background:#f5f5f7;border-radius:16px;padding:16px}.stat b{display:block;font-size:24px;letter-spacing:-.02em}.stat span{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}.footer{padding:40px 0 70px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);margin-top:30px}@media(max-width:720px){header .wrap{gap:12px}header nav a{padding:8px 10px;font-size:13px}.hero{padding:48px 0 30px}.match-hero{padding:28px 18px}.match-hero .score{font-size:38px}.wrap{padding:0 16px}}
</style>
</head>
<body>
<header><div class="wrap"><a href="#/"><div class="logo">CLUB</div></a><nav><a href="#/" data-nav="home">Матчи</a><a href="#/live" data-nav="live">Live</a><a href="#/players" data-nav="players">Игроки</a><a href="#/competitions" data-nav="competitions">Турниры</a></nav></div></header>
<main id="view"></main>
<footer class="footer"><div class="wrap">Club — матчи, статистика и live-трансляции.</div></footer>
<script type="module">
const API='https://pvocjvvzkvzhckilhokx.supabase.co/rest/v1';
const KEY='sb_publishable_amz1rV3zMWOZqazzODCDTw_MzIYN6pZ';
const view=document.getElementById('view');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=d=>new Date(d).toLocaleString('ru-RU',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
async function api(table,o={}){const u=new URL(`${API}/${table}`);const p=new URLSearchParams();p.set('select',o.select||'*');if(o.eq)for(const[k,v]of Object.entries(o.eq))p.append(k,`eq.${v}`);if(o.order)p.set('order',`${o.order.column}.${o.order.asc===false?'desc':'asc'}`);if(o.limit)p.set('limit',o.limit);u.search=p;const r=await fetch(u,{headers:{apikey:KEY,Authorization:`Bearer ${KEY}`}});const j=await r.json();if(!r.ok)throw new Error(j.message||`HTTP ${r.status}`);return j}
function skeleton(n=3){return Array.from({length:n},()=>'<div class="skeleton"></div>').join('')}
function errorBox(e){return `<div class="error">Не удалось загрузить данные.\n${esc(e?.message||e)}</div><div style="margin-top:14px"><button class="btn" onclick="location.reload()">Повторить</button></div>`}
function matchCard(m){const live=m.status==='live'||m.status==='in_progress';return `<a class="card" href="#/match/${m.id}"><div class="match-top"><span>${esc(fmtDate(m.kickoff))}</span>${live?`<span class="live-badge"><span class="dot"></span>LIVE ${m.minutes??''}</span>`:m.finished?'<span>FT</span>':'<span>Скоро</span>'}</div><div class="scoreboard"><span class="team">${esc(m.home)}</span><span class="score">${m.home_goals??'-'} : ${m.away_goals??'-'}</span><span class="team right">${esc(m.away)}</span></div><div class="row"><span class="meta">${esc(m.home)} — ${esc(m.away)}</span><span class="meta">Открыть →</span></div></a>`}
function hero(){return `<section class="hero"><div class="eyebrow">Club Live</div><h1>Футбол.<br>Живо. Просто.</h1><p>Матчи, результаты, статистика игроков и трансляции — в одном чистом интерфейсе.</p></section>`}
async function home(){view.innerHTML=hero()+`<section class="section"><div class="section-head"><h2>Live сейчас</h2><a href="#/live">Все live</a></div><div id="live" class="grid">${skeleton()}</div></section><section class="section"><div class="section-head"><h2>Предстоящие</h2></div><div id="up" class="grid">${skeleton()}</div></section><section class="section"><div class="section-head"><h2>Результаты</h2><a href="#/results">Все результаты</a></div><div id="done" class="grid">${skeleton()}</div></section>`;const all=await api('matches',{order:{column:'kickoff',asc:false},limit:180});const live=all.filter(m=>m.status==='live'||m.status==='in_progress');const up=all.filter(m=>!m.finished&&!live.includes(m)).slice(0,9);const fin=all.filter(m=>m.finished).slice(0,9);document.getElementById('live').innerHTML=live.length?live.map(matchCard).join(''):'<div class="empty">Сейчас нет live-матчей</div>';document.getElementById('up').innerHTML=up.map(matchCard).join('')||'<div class="empty">Нет предстоящих матчей</div>';document.getElementById('done').innerHTML=fin.map(matchCard).join('')||'<div class="empty">Нет результатов</div>'}
async function live(){view.innerHTML=`<h1>Live</h1><div id="list" class="grid">${skeleton()}</div>`;const all=await api('matches',{order:{column:'kickoff',asc:false},limit:180});const rows=all.filter(m=>m.status==='live'||m.status==='in_progress');document.getElementById('list').innerHTML=rows.length?rows.map(matchCard).join(''):'<div class="empty">Сейчас нет live-матчей</div>'}
async function results(){view.innerHTML=`<h1>Результаты</h1><div id="list" class="grid">${skeleton()}</div>`;const rows=await api('matches',{eq:{finished:true},order:{column:'kickoff',asc:false},limit:60});document.getElementById('list').innerHTML=rows.map(matchCard).join('')||'<div class="empty">Нет результатов</div>'}
async function match(id){view.innerHTML='<a class="back" href="#/">← Все матчи</a><div class="skeleton"></div>';const[m]=await api('matches',{eq:{id}});if(!m)throw new Error('Матч не найден');const[events,lineups,tstats,pstats,timeline]=await Promise.all([api('match_events',{select:'*,players(name)',eq:{match_id:id},order:{column:'minute',asc:true}}),api('match_lineups',{eq:{match_id:id},order:{column:'place',asc:true}}),api('match_team_stats',{eq:{match_id:id}}),api('player_match_stats',{select:'*,players(name,team,position,photo)',eq:{match_id:id}}),api('match_timeline',{eq:{match_id:id},order:{column:'minute',asc:true}})]);const homeLine=lineups.filter(x=>x.side==='home'&&x.starter),awayLine=lineups.filter(x=>x.side==='away'&&x.starter);const live=m.status==='live'||m.status==='in_progress';view.innerHTML=`<a class="back" href="#/">← Все матчи</a><section class="match-hero"><div class="row"><span class="meta">${esc(fmtDate(m.kickoff))}</span>${live?`<span class="pill live"><span class="dot"></span>LIVE ${m.minutes??''}</span>`:m.finished?'<span class="pill">Завершён</span>':''}</div><div class="scoreboard"><span class="team">${esc(m.home)}</span><span class="score">${m.home_goals??'-'} : ${m.away_goals??'-'}</span><span class="team right">${esc(m.away)}</span></div></section><section class="card"><h3>Трансляция</h3><div class="video"><video id="video" controls playsinline></video></div><div style="display:flex;gap:10px;margin-top:14px"><input class="input" id="url" placeholder="Вставь HLS-ссылку .m3u8" value="${esc(localStorage.getItem('stream_'+id)||'')}"><button class="btn" id="play">Смотреть</button></div></section><div class="tabs"><button class="tab on" data-tab="overview">Обзор</button><button class="tab" data-tab="lineups">Составы</button><button class="tab" data-tab="stats">Статистика</button><button class="tab" data-tab="players">Игроки</button></div><div id="tab-overview"><div class="card"><h3>Хронология</h3>${timeline.length?timeline.map(t=>`<div class="timeline"><b>${t.minute??''}'</b><span><b>${esc(t.player||'')}</b> ${esc(t.detail||t.type||'')}</span></div>`).join(''):'<div class="empty">Хронология пока недоступна</div>'}</div><div class="card" style="margin-top:16px"><h3>События</h3>${events.length?events.map(e=>`<div class="timeline"><b>${e.minute??''}'</b><span>${esc(e.players?.name||'')} — ${esc(e.type)}</span></div>`).join(''):'<div class="empty">Событий пока нет</div>'}</div></div><div id="tab-lineups" hidden><div class="card"><h3>${esc(m.home)}</h3>${homeLine.map(x=>`<div class="timeline"><b>${esc(x.pos||'')}</b><span>${esc(x.name)}</span></div>`).join('')||'<div class="empty">Нет данных</div>'}</div><div class="card" style="margin-top:16px"><h3>${esc(m.away)}</h3>${awayLine.map(x=>`<div class="timeline"><b>${esc(x.pos||'')}</b><span>${esc(x.name)}</span></div>`).join('')||'<div class="empty">Нет данных</div>'}</div></div><div id="tab-stats" hidden><div class="card"><h3>Статистика команд</h3>${tstats.length?tstats.map(s=>`<div class="stat-grid">${Object.entries(s.stats||{}).slice(0,12).map(([k,v])=>`<div class="stat"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>`).join(''):'<div class="empty">Статистика пока недоступна</div>'}</div></div><div id="tab-players" hidden><div class="card"><h3>Игроки матча</h3>${pstats.length?`<table><thead><tr><th>Игрок</th><th class="num">Рейтинг</th><th class="num">Голы</th><th class="num">Ассисты</th></tr></thead><tbody>${pstats.map(s=>`<tr><td><a href="#/player/${s.player_id}">${esc(s.players?.name||'')}</a></td><td class="num">${s.rating??'-'}</td><td class="num">${s.stats?.goals??0}</td><td class="num">${s.stats?.assists??0}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Статистика игроков пока недоступна</div>'}</div></div>`;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');['overview','lineups','stats','players'].forEach(x=>document.getElementById('tab-'+x).hidden=x!==b.dataset.tab)});document.getElementById('play').onclick=()=>play(id)}
async function play(id){const url=document.getElementById('url').value.trim();localStorage.setItem('stream_'+id,url);const v=document.getElementById('video');if(!url)return alert('Вставь ссылку на трансляцию');if(url.includes('.m3u8')){const{default:Hls}=await import('https://esm.sh/hls.js@1');if(Hls.isSupported()){const h=new Hls();h.loadSource(url);h.attachMedia(v);h.on(Hls.Events.MANIFEST_PARSED,()=>v.play())}else{v.src=url;v.play()}}else{v.src=url;v.play()}}
async function players(){view.innerHTML=`<h1>Игроки</h1><input class="input" id="q" placeholder="Поиск по имени или команде"><div id="list" class="player-grid" style="margin-top:20px">${skeleton()}</div>`;const all=await api('players',{order:{column:'rating',asc:false},limit:250});const draw=()=>{const q=document.getElementById('q').value.toLowerCase();document.getElementById('list').innerHTML=all.filter(p=>(p.name||'').toLowerCase().includes(q)||(p.team||'').toLowerCase().includes(q)).slice(0,80).map(p=>`<a class="card player-card" href="#/player/${p.id}"><img class="avatar" src="${esc(p.photo||'')}" onerror="this.style.display='none'"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.team||'')} · ${esc(p.position||'')}</div></div><span class="pill" style="margin-left:auto">${p.rating??'-'}</span></a>`).join('')||'<div class="empty">Ничего не найдено</div>'};document.getElementById('q').oninput=draw;draw()}
async function player(id){view.innerHTML='<a class="back" href="#/players">← Игроки</a><div class="skeleton"></div>';const[p]=await api('players',{eq:{id}});if(!p)throw new Error('Игрок не найден');const[ratings,season]=await Promise.all([api('player_match_ratings',{select:'*,matches(home,away,kickoff)',eq:{player_id:id},order:{column:'match_id',asc:false},limit:25}),api('player_season_stats',{eq:{player_id:id}})]);const s=season[0]?.data||{};view.innerHTML=`<a class="back" href="#/players">← Игроки</a><div class="card player-card"><img class="avatar" src="${esc(p.photo||'')}" onerror="this.style.display='none'"><div><h1 style="margin:0">${esc(p.name)}</h1><div class="muted">${esc(p.team||'')} · ${esc(p.position||'')}</div></div><span class="pill" style="margin-left:auto">Рейтинг ${p.rating??'-'}</span></div><div class="card" style="margin-top:16px"><h3>Сезон</h3><div class="stat-grid">${Object.entries(s).slice(0,10).map(([k,v])=>`<div class="stat"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')||'<div class="empty">Сезонная статистика пока недоступна</div>'}</div></div><div class="card" style="margin-top:16px"><h3>Последние матчи</h3>${ratings.length?`<table><thead><tr><th>Матч</th><th class="num">Мин</th><th class="num">Г</th><th class="num">А</th><th class="num">Рейтинг</th></tr></thead><tbody>${ratings.map(r=>`<tr><td><a href="#/match/${r.match_id}">${esc(r.matches?.home||'')} — ${esc(r.matches?.away||'')}</a></td><td class="num">${r.minutes??0}</td><td class="num">${r.goals??0}</td><td class="num">${r.assists??0}</td><td class="num">${r.rating??'-'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Нет матчей</div>'}</div>`}
async function competitions(){view.innerHTML=`<h1>Турниры</h1><div id="list" class="grid">${skeleton()}</div>`;const rows=await api('competitions',{order:{column:'sort',asc:true}});document.getElementById('list').innerHTML=rows.map(c=>`<div class="card"><div class="row"><b>${esc(c.name)}</b><span class="pill">${esc(c.short||'')}</span></div><div class="muted">Сезон ${c.season??''}</div></div>`).join('')||'<div class="empty">Нет турниров</div>'}
function route(){const h=location.hash||'#/';document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on',h.startsWith('#/'+a.dataset.nav)));if(h.startsWith('#/match/'))return match(h.split('/')[2]);if(h.startsWith('#/player/'))return player(h.split('/')[2]);if(h==='#/live')return live();if(h==='#/results')return results();if(h==='#/players')return players();if(h==='#/competitions')return competitions();return home()}
window.addEventListener('hashchange',()=>route().catch(e=>view.innerHTML=errorBox(e)));route().catch(e=>view.innerHTML=errorBox(e));
setInterval(()=>{const h=location.hash;if(h==='#/'||h==='#/live')route().catch(()=>{})},30000);
</script>
</body>
</html>
